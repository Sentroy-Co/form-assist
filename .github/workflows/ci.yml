name: Verify Form Assist
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build --prefix examples/next
      - run: npm run test:next
      - run: npm run build:demo
      - run: npm run pack:local
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: form-assist-local-packages-and-launch
          path: |
            artifacts/*.tgz
            artifacts/launch/
            artifacts/*.png
